<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Portfolio, Abe Nito</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='16' fill='%23000'/%3E%3C/svg%3E">
<!-- Google Analytics -->
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  var gaChoice = null;
  try { gaChoice = localStorage.getItem("ga-consent"); } catch (e) {}
  gtag("consent", "default", { analytics_storage: gaChoice === "denied" ? "denied" : "granted", ad_storage: "denied", ad_user_data: "denied", ad_personalization: "denied" });
  gtag("js", new Date());
  gtag("config", "G-T7JPN658FL");
  function track(name, params) { gtag("event", name, params || {}); }
</script>
<script async src="https://www.googletagmanager.com/gtag/js?id=G-T7JPN658FL"></script>
<style>
  :root {
    --bg: #FFFADB;
    --ink: #14211D;
    --muted: #56655F;
    --rule: #C9D2CB;
    --link: #2E46C8;
    --font: "Helvetica Neue", Helvetica, Arial, sans-serif;
  }
  *, *::before, *::after { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font);
    font-size: 1.0625rem; line-height: 1.55; display: flex; flex-direction: column;
    padding: clamp(1.5rem, 6vw, 4.5rem);
  }
  main { flex: 1; display: flex; flex-direction: column; justify-content: center; max-width: 52rem; }
  h1 { font-size: clamp(3rem, 11vw, 8rem); font-weight: 500; letter-spacing: -0.04em; line-height: 0.92; margin: 0; }
  .lede { font-size: clamp(1.15rem, 2.4vw, 1.5rem); margin: 1.5rem 0 0; }
  form { margin: clamp(2rem, 5vw, 3rem) 0 0; max-width: 34rem; }
  label { display: block; font-weight: 500; margin-bottom: 0.5rem; }
  .row { display: flex; gap: 0.75rem; flex-wrap: wrap; }
  input {
    flex: 1 1 12rem; font: inherit; padding: 0.75rem 0.9rem; min-height: 48px;
    border: 1px solid var(--ink); border-radius: 4px; background: #fff; color: var(--ink);
  }
  button {
    font: inherit; font-weight: 500; padding: 0.75rem 1.25rem; min-height: 48px;
    border: 1px solid var(--ink); border-radius: 4px; background: var(--ink); color: var(--bg); cursor: pointer;
  }
  button:hover { background: var(--link); border-color: var(--link); }
  .error { color: #A1260D; margin: 0.75rem 0 0; min-height: 1.55em; }
  .meta { margin: 1.5rem 0 0; color: var(--muted); }
  a { color: var(--ink); text-underline-offset: 0.18em; }
  a:hover { color: var(--link); }
  :focus-visible { outline: 3px solid var(--link); outline-offset: 3px; border-radius: 2px; }
  [hidden] { display: none !important; }
  .ga-notice {
    position: fixed; left: 1rem; bottom: 1rem; z-index: 5; max-width: 22rem;
    display: flex; align-items: center; gap: 0.75rem; flex-wrap: wrap;
    padding: 0.75rem 0.9rem; background: #fff; color: #14211D; border: 1px solid #C9D2CB; border-radius: 8px;
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; font-size: 0.875rem; line-height: 1.4;
    box-shadow: 0 6px 18px rgba(20, 33, 29, 0.08);
  }
  .ga-notice p { margin: 0; flex: 1 1 100%; }
  .ga-notice button {
    font: inherit; font-weight: 500; min-height: 44px; padding: 0 0.9rem; border-radius: 6px; cursor: pointer;
    border: 1px solid #14211D; background: #14211D; color: #FFFADB;
  }
  .ga-notice button.ga-out { background: transparent; color: #14211D; border-color: #C9D2CB; }
  .ga-notice[hidden] { display: none; }
</style>
</head>
<body>
<main>
  <section id="gate" aria-labelledby="gate-title">
    <h1 id="gate-title">Portfolio</h1>
    <p class="lede">This page is password protected.</p>
    <form id="unlock">
      <label for="pw">Password</label>
      <div class="row">
        <input id="pw" type="password" autocomplete="current-password" required>
        <button type="submit">View portfolio</button>
      </div>
      <p class="error" id="error" role="alert"></p>
    </form>
    <p class="meta">No password? <a href="mailto:hello@abenito.com?subject=Portfolio%20access" onclick="track('request_access', {location: 'portfolio_page'})">Email for access</a></p>
    <p class="meta"><a href="./">Back to home</a></p>
  </section>

  <section id="content" aria-labelledby="content-title" hidden>
    <h1 id="content-title" tabindex="-1">Portfolio</h1>
    <p class="lede">Case studies are coming soon.</p>
    <p class="meta"><a href="./">Back to home</a></p>
  </section>
</main>
<script>
  // Note: this only hides the page from casual visitors. It is not real security.
  var HASH = "73a2af8864fc500fa49048bf3003776c19938f360e56bd03663866fb3087884a";
  var gate = document.getElementById("gate"), content = document.getElementById("content");
  function unlock() { gate.hidden = true; content.hidden = false; }
  try { if (sessionStorage.getItem("portfolio") === "1") unlock(); } catch (e) {}
  async function sha256(t) {
    var buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(t));
    return Array.from(new Uint8Array(buf)).map(function (b) { return b.toString(16).padStart(2, "0"); }).join("");
  }
  document.getElementById("unlock").addEventListener("submit", async function (e) {
    e.preventDefault();
    var input = document.getElementById("pw"), err = document.getElementById("error");
    if (await sha256(input.value.trim()) === HASH) {
      try { sessionStorage.setItem("portfolio", "1"); } catch (e) {}
      track("portfolio_unlocked", {location: "portfolio_page"});
      err.textContent = ""; unlock(); document.getElementById("content-title").focus();
    } else {
      err.textContent = "That password isn't right. Check it and try again, or email me for access.";
      input.select();
    }
  });
</script>
<div class="ga-notice" id="ga-notice" role="region" aria-label="Analytics notice" hidden>
  <p>This site uses Google Analytics to see how it's used.</p>
  <button type="button" id="ga-ok">OK</button>
  <button type="button" class="ga-out" id="ga-out">Opt out</button>
</div>
<script>
  (function () {
    var box = document.getElementById("ga-notice");
    var saved = null;
    try { saved = localStorage.getItem("ga-consent"); } catch (e) {}
    if (!saved) box.hidden = false;
    function choose(v) {
      try { localStorage.setItem("ga-consent", v); } catch (e) {}
      gtag("consent", "update", { analytics_storage: v });
      box.hidden = true;
    }
    document.getElementById("ga-ok").addEventListener("click", function () { choose("granted"); });
    document.getElementById("ga-out").addEventListener("click", function () { choose("denied"); });
  })();
</script>
</body>
</html>
