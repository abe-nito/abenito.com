<style>
  :root {
    --bg: #FFFADB;
    --ink: #14211D;
    --muted: #56655F;
    --rule: #C9D2CB;
    --link: #2E46C8;
    --font: "Helvetica Neue", Helvetica, Arial, sans-serif;
  }
  *, *::before, *::after { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font);
    font-size: 1.0625rem;
    line-height: 1.55;
    display: flex;
    flex-direction: column;
    padding: clamp(1.5rem, 6vw, 4.5rem);
  }
  main { flex: 1; display: flex; flex-direction: column; justify-content: center; max-width: 52rem; }
  h1 {
    font-size: clamp(3rem, 11vw, 8rem);
    font-weight: 500;
    letter-spacing: -0.04em;
    line-height: 0.92;
    margin: 0;
  }
  /* Hello / Kamusta: both words stacked in one cell, crossfading */
  .greet { display: inline-grid; }
  .greet span { grid-area: 1 / 1; padding-bottom: 0.08em; }
  .greet span + span { opacity: 0; }
  @media (prefers-reduced-motion: no-preference) {
    .greet span { animation: swap 6s cubic-bezier(.6,0,.2,1) infinite; }
    .greet span + span { animation-name: swap-in; }
    @keyframes swap {
      0%, 42%   { opacity: 1; transform: none; }
      50%, 92%  { opacity: 0; transform: translateY(-0.18em); }
      100%      { opacity: 1; transform: none; }
    }
    @keyframes swap-in {
      0%, 42%   { opacity: 0; transform: translateY(0.18em); }
      50%, 92%  { opacity: 1; transform: none; }
      100%      { opacity: 0; transform: translateY(0.18em); }
    }
  }
  .role { font-size: clamp(1.15rem, 2.4vw, 1.5rem); margin: 1.5rem 0 0; color: var(--ink); }
  .note { margin: 0.5rem 0 0; color: var(--muted); max-width: 34rem; }
  .actions {
    list-style: none; margin: clamp(2.5rem, 6vw, 4rem) 0 0; padding: 0;
    border-top: 1px solid var(--rule); max-width: 34rem;
  }
  .actions li { border-bottom: 1px solid var(--rule); }
  .actions a {
    display: flex; justify-content: space-between; align-items: baseline; gap: 1rem;
    padding: 1rem 0; color: var(--ink); text-decoration: none; font-size: 1.25rem; font-weight: 500;
  }
  .actions a span { color: var(--muted); font-size: 1rem; font-weight: 400; }
  .actions a:hover, .actions a:hover span { color: var(--link); }
  .open-pw {
    width: 100%; display: flex; justify-content: space-between; align-items: baseline; gap: 1rem;
    padding: 1rem 0; background: none; border: 0; font: inherit; color: var(--ink);
    font-size: 1.25rem; font-weight: 500; text-align: left; cursor: pointer;
  }
  .open-pw span { color: var(--muted); font-size: 1rem; font-weight: 400; }
  .open-pw:hover, .open-pw:hover span { color: var(--link); }
  dialog {
    position: fixed; border: 0; border-radius: 12px; padding: 2rem; width: min(26.25rem, calc(100vw - 2rem));
    background: var(--bg); color: var(--ink); font-family: var(--font);
    box-shadow: 0 24px 48px rgba(20, 33, 29, 0.18), 0 2px 6px rgba(20, 33, 29, 0.08);
  }
  dialog::backdrop { background: rgba(20, 33, 29, 0.3); }
  dialog h2 { font-size: 1.625rem; font-weight: 500; letter-spacing: -0.02em; line-height: 1.15; margin: 0 0 1.5rem; }
  dialog label { display: block; font-size: 0.875rem; font-weight: 500; margin-bottom: 0.5rem; }
  dialog input {
    width: 100%; height: 48px; padding: 0 0.875rem; font: inherit; font-size: 1rem;
    border: 1px solid #8E9A93; border-radius: 8px; background: #fff; color: var(--ink);
  }
  dialog input[aria-invalid="true"] { border: 2px solid #A1260D; }
  .pw-error { color: #A1260D; margin: 0.5rem 0 0; font-size: 0.875rem; }
  .pw-submit {
    margin-top: 0.75rem; width: 100%; height: 48px; font: inherit; font-size: 1rem; font-weight: 500;
    border: 0; border-radius: 8px; background: var(--ink); color: var(--bg); cursor: pointer;
  }
  .pw-submit:hover { background: var(--link); }
  .pw-x {
    position: absolute; top: 14px; right: 14px; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center;
    background: transparent; border: 0; border-radius: 22px; color: var(--ink); cursor: pointer;
  }
  .pw-x:hover { background: rgba(20, 33, 29, 0.06); }
  .pw-foot { margin: 1.25rem 0 0; padding-top: 1.125rem; border-top: 1px solid #E6DFB8; font-size: 0.875rem; color: var(--muted); }
  .pw-foot a { color: var(--ink); text-underline-offset: 0.18em; }
  .pw-foot a:hover { color: var(--link); }
  @media (max-width: 600px) { .pw-foot a { display: block; width: fit-content; margin-top: 0.25rem; } }
  :focus-visible { outline: 3px solid var(--link); outline-offset: 3px; border-radius: 2px; }
  a:focus-visible { outline: 3px solid var(--link); outline-offset: 4px; border-radius: 2px; }
  .ga-notice {
    position: fixed; left: 1rem; bottom: 1rem; z-index: 5; max-width: 22rem;
    display: flex; align-items: center; gap: 0.75rem; flex-wrap: wrap;
    padding: 0.75rem 0.9rem; background: #fff; color: #14211D; border: 1px solid #C9D2CB; border-radius: 8px;
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; font-size: 0.875rem; line-height: 1.4;
    box-shadow: 0 6px 18px rgba(20, 33, 29, 0.08);
  }
  .ga-notice p { margin: 0; flex: 1 1 100%; }
  .ga-notice button {
    font: inherit; font-weight: 500; min-height: 44px; padding: 0 0.9rem; border-radius: 6px; cursor: pointer;
    border: 1px solid #14211D; background: #14211D; color: #FFFADB;
  }
  .ga-notice button.ga-out { background: transparent; color: #14211D; border-color: #C9D2CB; }
  .ga-notice[hidden] { display: none; }
</style>
</head>
<body>
<main>
  <h1 aria-label="Hello"><span class="greet" aria-hidden="true"><span>Hello</span><span lang="tl">Kamusta</span></span></h1>
  <p class="role">I'm Abe Nito<br>— product designer at Microsoft</p>
  <ul class="actions">
    <li><button type="button" class="open-pw" aria-haspopup="dialog">Portfolio <span>View</span></button></li>
    <li><a href="resume.pdf" onclick="track('resume_click')">Resume <span>PDF</span></a></li>
    <li><a href="about.html" onclick="track('about_click')">About <span>Read</span></a></li>
    <li><a href="mailto:hello@abenito.com" onclick="track('email_click')">Email <span>hello@abenito.com</span></a></li>
    <li><a href="https://www.linkedin.com/in/abenito/" onclick="track('linkedin_click')">LinkedIn <span>/in/abenito</span></a></li>
  </ul>
</main>

<dialog id="pw-dialog" aria-labelledby="pw-title">
  <button type="button" class="pw-x" id="pw-close" aria-label="Close"><svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M4 4l10 10M14 4L4 14"/></svg></button>
  <form id="pw-form">
    <h2 id="pw-title">Portfolio</h2>
    <label for="pw">Password</label>
    <input id="pw" type="password" autocomplete="current-password" required aria-describedby="pw-error">
    <p class="pw-error" id="pw-error" role="alert" hidden></p>
    <button type="submit" class="pw-submit">View portfolio</button>
    <p class="pw-foot">No password? <a href="mailto:hello@abenito.com?subject=Portfolio%20access" onclick="track('request_access', {location: 'popup'})">Email hello@abenito.com for access</a></p>
  </form>
</dialog>
<script>
  // Simple gate for casual visitors only. Not real security.
  var HASH = "73a2af8864fc500fa49048bf3003776c19938f360e56bd03663866fb3087884a";
  var dlg = document.getElementById("pw-dialog"), input = document.getElementById("pw"), err = document.getElementById("pw-error");
  document.querySelector(".open-pw").addEventListener("click", function () {
    try { if (sessionStorage.getItem("portfolio") === "1") { location.href = "portfolio.html"; return; } } catch (e) {}
    track("portfolio_open"); err.hidden = true; input.removeAttribute("aria-invalid"); input.value = ""; dlg.showModal(); input.focus();
  });
  document.getElementById("pw-close").addEventListener("click", function () { dlg.close(); });
  async function sha256(t) {
    var buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(t));
    return Array.from(new Uint8Array(buf)).map(function (b) { return b.toString(16).padStart(2, "0"); }).join("");
  }
  document.getElementById("pw-form").addEventListener("submit", async function (e) {
    e.preventDefault();
    if (await sha256(input.value.trim()) === HASH) {
      try { sessionStorage.setItem("portfolio", "1"); } catch (e) {}
      track("portfolio_unlocked", {location: "popup"});
      setTimeout(function () { location.href = "portfolio.html"; }, 150);
    } else {
      track("portfolio_wrong_password");
      err.textContent = "That password didn't work. Check it and try again.";
      err.hidden = false; input.setAttribute("aria-invalid", "true"); input.select();
    }
  });
</script>
<div class="ga-notice" id="ga-notice" role="region" aria-label="Analytics notice" hidden>
  <p>This site uses Google Analytics to see how it's used.</p>
  <button type="button" id="ga-ok">OK</button>
  <button type="button" class="ga-out" id="ga-out">Opt out</button>
</div>
<script>
  (function () {
    var box = document.getElementById("ga-notice");
    var saved = null;
    try { saved = localStorage.getItem("ga-consent"); } catch (e) {}
    if (!saved) box.hidden = false;
    function choose(v) {
      try { localStorage.setItem("ga-consent", v); } catch (e) {}
      gtag("consent", "update", { analytics_storage: v });
      box.hidden = true;
    }
    document.getElementById("ga-ok").addEventListener("click", function () { choose("granted"); });
    document.getElementById("ga-out").addEventListener("click", function () { choose("denied"); });
  })();
</script>
</body>
</html>
