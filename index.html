<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Abe Nito, product designer</title>
<meta name="description" content="Abe Nito is a product designer at Microsoft in Vancouver. Portfolio coming soon.">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='16' fill='%23000'/%3E%3C/svg%3E">
<style>
  :root {
    --bg: #EEF1EC;
    --ink: #14211D;
    --muted: #56655F;
    --rule: #C9D2CB;
    --link: #2E46C8;
    --font: "Helvetica Neue", Helvetica, Arial, sans-serif;
  }
  *, *::before, *::after { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font);
    font-size: 1.0625rem;
    line-height: 1.55;
    display: flex;
    flex-direction: column;
    padding: clamp(1.5rem, 6vw, 4.5rem);
  }
  main { flex: 1; display: flex; flex-direction: column; justify-content: center; max-width: 52rem; }
  h1 {
    font-size: clamp(3rem, 11vw, 8rem);
    font-weight: 500;
    letter-spacing: -0.04em;
    line-height: 0.92;
    margin: 0;
  }
  /* Hello / Kamusta: both words stacked in one cell, crossfading */
  .greet { display: inline-grid; }
  .greet span { grid-area: 1 / 1; padding-bottom: 0.08em; }
  .greet span + span { opacity: 0; }
  @media (prefers-reduced-motion: no-preference) {
    .greet span { animation: swap 6s cubic-bezier(.6,0,.2,1) infinite; }
    .greet span + span { animation-name: swap-in; }
    @keyframes swap {
      0%, 42%   { opacity: 1; transform: none; }
      50%, 92%  { opacity: 0; transform: translateY(-0.18em); }
      100%      { opacity: 1; transform: none; }
    }
    @keyframes swap-in {
      0%, 42%   { opacity: 0; transform: translateY(0.18em); }
      50%, 92%  { opacity: 1; transform: none; }
      100%      { opacity: 0; transform: translateY(0.18em); }
    }
  }
  .role { font-size: clamp(1.15rem, 2.4vw, 1.5rem); margin: 1.5rem 0 0; color: var(--ink); }
  .note { margin: 0.5rem 0 0; color: var(--muted); max-width: 34rem; }
  .actions {
    list-style: none; margin: clamp(2.5rem, 6vw, 4rem) 0 0; padding: 0;
    border-top: 1px solid var(--rule); max-width: 34rem;
  }
  .actions li { border-bottom: 1px solid var(--rule); }
  .actions a {
    display: flex; justify-content: space-between; align-items: baseline; gap: 1rem;
    padding: 1rem 0; color: var(--ink); text-decoration: none; font-size: 1.25rem; font-weight: 500;
  }
  .actions a span { color: var(--muted); font-size: 1rem; font-weight: 400; }
  .actions a:hover, .actions a:hover span { color: var(--link); }
  a:focus-visible { outline: 3px solid var(--link); outline-offset: 4px; border-radius: 2px; }
</style>
</head>
<body>
<main>
  <h1 aria-label="Hello"><span class="greet" aria-hidden="true"><span>Hello</span><span lang="tl">Kamusta</span></span></h1>
  <p class="role">I'm Abe Nito — product designer at Microsoft.</p>
  <p class="note">This portfolio is in progress.</p>
  <ul class="actions">
    <li><a href="mailto:abe.nito@outlook.com">Email me <span>abe.nito@outlook.com</span></a></li>
    <li><a href="https://www.linkedin.com/in/abenito/">LinkedIn <span>/in/abenito</span></a></li>
  </ul>
</main>
</body>
</html>
