<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Abe Nito, product designer</title>
<meta name="description" content="Abe Nito is a product designer at Microsoft in Vancouver. Portfolio coming soon.">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='16' fill='%23000'/%3E%3C/svg%3E">
<style>
  :root {
    --bg: #FFFADB;
    --ink: #14211D;
    --muted: #56655F;
    --rule: #C9D2CB;
    --link: #2E46C8;
    --font: "Helvetica Neue", Helvetica, Arial, sans-serif;
  }
  *, *::before, *::after { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font);
    font-size: 1.0625rem;
    line-height: 1.55;
    display: flex;
    flex-direction: column;
    padding: clamp(1.5rem, 6vw, 4.5rem);
  }
  main { flex: 1; display: flex; flex-direction: column; justify-content: center; max-width: 52rem; }
  h1 {
    font-size: clamp(3rem, 11vw, 8rem);
    font-weight: 500;
    letter-spacing: -0.04em;
    line-height: 0.92;
    margin: 0;
  }
  /* Hello / Kamusta: both words stacked in one cell, crossfading */
  .greet { display: inline-grid; }
  .greet span { grid-area: 1 / 1; padding-bottom: 0.08em; }
  .greet span + span { opacity: 0; }
  @media (prefers-reduced-motion: no-preference) {
    .greet span { animation: swap 6s cubic-bezier(.6,0,.2,1) infinite; }
    .greet span + span { animation-name: swap-in; }
    @keyframes swap {
      0%, 42%   { opacity: 1; transform: none; }
      50%, 92%  { opacity: 0; transform: translateY(-0.18em); }
      100%      { opacity: 1; transform: none; }
    }
    @keyframes swap-in {
      0%, 42%   { opacity: 0; transform: translateY(0.18em); }
      50%, 92%  { opacity: 1; transform: none; }
      100%      { opacity: 0; transform: translateY(0.18em); }
    }
  }
  .role { font-size: clamp(1.15rem, 2.4vw, 1.5rem); margin: 1.5rem 0 0; color: var(--ink); }
  .note { margin: 0.5rem 0 0; color: var(--muted); max-width: 34rem; }
  .actions {
    list-style: none; margin: clamp(2.5rem, 6vw, 4rem) 0 0; padding: 0;
    border-top: 1px solid var(--rule); max-width: 34rem;
  }
  .actions li { border-bottom: 1px solid var(--rule); }
  .actions a {
    display: flex; justify-content: space-between; align-items: baseline; gap: 1rem;
    padding: 1rem 0; color: var(--ink); text-decoration: none; font-size: 1.25rem; font-weight: 500;
  }
  .actions a span { color: var(--muted); font-size: 1rem; font-weight: 400; }
  .actions a:hover, .actions a:hover span { color: var(--link); }
  .open-pw {
    width: 100%; display: flex; justify-content: space-between; align-items: baseline; gap: 1rem;
    padding: 1rem 0; background: none; border: 0; font: inherit; color: var(--ink);
    font-size: 1.25rem; font-weight: 500; text-align: left; cursor: pointer;
  }
  .open-pw span { color: var(--muted); font-size: 1rem; font-weight: 400; }
  .open-pw:hover, .open-pw:hover span { color: var(--link); }
  dialog {
    border: 1px solid var(--ink); border-radius: 6px; padding: 1.75rem; width: min(28rem, calc(100vw - 2rem));
    background: var(--bg); color: var(--ink); font-family: var(--font);
  }
  dialog::backdrop { background: rgba(20, 33, 29, 0.35); }
  dialog h2 { font-size: 1.5rem; font-weight: 500; letter-spacing: -0.02em; margin: 0 0 1rem; }
  dialog label { display: block; font-weight: 500; margin-bottom: 0.5rem; }
  .pw-row { display: flex; gap: 0.75rem; flex-wrap: wrap; }
  .pw-row input {
    flex: 1 1 10rem; font: inherit; padding: 0.7rem 0.85rem; min-height: 48px;
    border: 1px solid var(--ink); border-radius: 4px; background: #fff; color: var(--ink);
  }
  .pw-row button, .close {
    font: inherit; font-weight: 500; padding: 0.7rem 1.1rem; min-height: 48px; border-radius: 4px; cursor: pointer;
  }
  .pw-row button { border: 1px solid var(--ink); background: var(--ink); color: var(--bg); }
  .pw-row button:hover { background: var(--link); border-color: var(--link); }
  .pw-error { color: #A1260D; margin: 0.6rem 0 0; min-height: 1.55em; font-size: 0.95rem; }
  .pw-foot { display: flex; justify-content: space-between; align-items: center; gap: 1rem; flex-wrap: wrap; margin-top: 0.5rem; }
  .pw-foot a { color: var(--ink); text-underline-offset: 0.18em; }
  .pw-foot a:hover { color: var(--link); }
  .close { border: 1px solid var(--rule); background: transparent; color: var(--ink); }
  .close:hover { border-color: var(--ink); }
  :focus-visible { outline: 3px solid var(--link); outline-offset: 3px; border-radius: 2px; }
  a:focus-visible { outline: 3px solid var(--link); outline-offset: 4px; border-radius: 2px; }
</style>
</head>
<body>
<main>
  <h1 aria-label="Hello"><span class="greet" aria-hidden="true"><span>Hello</span><span lang="tl">Kamusta</span></span></h1>
  <p class="role">I'm Abe Nito<br>— product designer at Microsoft.</p>
  <ul class="actions">
    <li><button type="button" class="open-pw" aria-haspopup="dialog">Portfolio <span>View</span></button></li>
    <li><a href="resume.pdf">Resume <span>PDF</span></a></li>
    <li><a href="mailto:hello@abenito.com">Email <span>hello@abenito.com</span></a></li>
    <li><a href="https://www.linkedin.com/in/abenito/">LinkedIn <span>/in/abenito</span></a></li>
  </ul>
</main>

<dialog id="pw-dialog" aria-labelledby="pw-title">
  <form id="pw-form">
    <h2 id="pw-title">View portfolio</h2>
    <label for="pw">Password</label>
    <div class="pw-row">
      <input id="pw" type="password" autocomplete="current-password" required>
      <button type="submit">View portfolio</button>
    </div>
    <p class="pw-error" id="pw-error" role="alert"></p>
    <div class="pw-foot">
      <a href="mailto:hello@abenito.com?subject=Portfolio%20access">Email to view portfolio</a>
      <button type="button" class="close" id="pw-close">Close</button>
    </div>
  </form>
</dialog>
<script>
  // Simple gate for casual visitors only. Not real security.
  var HASH = "81a83544cf93c245178cbc1620030f1123f435af867c79d87135983c52ab39d9";
  var dlg = document.getElementById("pw-dialog"), input = document.getElementById("pw"), err = document.getElementById("pw-error");
  document.querySelector(".open-pw").addEventListener("click", function () {
    try { if (sessionStorage.getItem("portfolio") === "1") { location.href = "portfolio.html"; return; } } catch (e) {}
    err.textContent = ""; input.value = ""; dlg.showModal(); input.focus();
  });
  document.getElementById("pw-close").addEventListener("click", function () { dlg.close(); });
  async function sha256(t) {
    var buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(t));
    return Array.from(new Uint8Array(buf)).map(function (b) { return b.toString(16).padStart(2, "0"); }).join("");
  }
  document.getElementById("pw-form").addEventListener("submit", async function (e) {
    e.preventDefault();
    if (await sha256(input.value.trim()) === HASH) {
      try { sessionStorage.setItem("portfolio", "1"); } catch (e) {}
      location.href = "portfolio.html";
    } else {
      err.textContent = "That password isn't right. Try again, or email me for access.";
      input.select();
    }
  });
</script>
</body>
</html>
